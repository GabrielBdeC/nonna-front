        <main class="container mt-4" style="max-width: 420px;">
            <h1>Entrar</h1>

            <div id="alert-container"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" required>
                </div>
                <button type="submit" class="btn btn-nonna w-100">Entrar</button>
            </form>

            <p class="text-center mt-3">
                Ainda não tem conta? <a href="registro.html">Cadastre-se</a>
            </p>

            <p class="text-muted small mt-4">
                Dados de teste: <code>admin@nonna.com</code> / <code>admin123</code> (administrador)
                ou <code>joao@example.com</code> / <code>senha123</code> (cliente).
            </p>
        </main>

        <footer>
