name: deploy
on:
  push:
    branches: [main]
jobs:
  front:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Apontar a API para o Render
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          test -n "$API_URL" || { echo "Variavel API_URL nao definida"; exit 1; }
          sed -i "s|http://localhost:8080|$API_URL|" public/scripts/api.js
          grep -n "API_BASE_URL =" public/scripts/api.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - uses: actions/deploy-pages@v4
