        <meta charset="UTF-8">

        <link rel="stylesheet" href="public/style/index.css">
    </head>
    <body>
        <nav>
            <a href="index.html">Cantina da Nonna</a>
            <div class="links-nav">
                <a href="index.html">Início</a>

            </div>

        <main class="container mt-4" style="max-width: 460px;">
            <h1>Minha conta</h1>
            <p class="text-muted">Seus dados. Só você pode trocar a sua própria senha -- nem um administrador faz isso por você.</p>

            <div id="alert-container"></div>

            <form id="perfilForm">
                <div class="mb-3">
                    <label for="perfil-nome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="perfil-nome" required>
                </div>
                <div class="mb-3">
                    <label for="perfil-email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="perfil-email" required>
                </div>
                <div class="mb-3">
                    <label for="perfil-telefone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="perfil-telefone">
                </div>
                <div class="mb-3">
                    <label for="perfil-tipo" class="form-label">Tipo de conta</label>
                    <input type="text" class="form-control" id="perfil-tipo" disabled>
                </div>

                <hr>

                <div class="mb-3">
                    <label for="perfil-senha-atual" class="form-label">Senha atual</label>
                    <input type="password" class="form-control" id="perfil-senha-atual">
                </div>
                <div class="mb-3">
                    <label for="perfil-senha-nova" class="form-label">Nova senha</label>
                    <input type="password" class="form-control" id="perfil-senha-nova">
                    <div class="form-text">Deixe as duas em branco para manter a senha atual.</div>
                </div>

                <button type="submit" class="btn btn-nonna w-100">Salvar alterações</button>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Cantina da Nonna.</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="public/scripts/sessao.js"></script>
        <script src="public/scripts/api.js"></script>
        <script src="public/scripts/ui.js"></script>
        <script src="public/scripts/perfil.js"></script>
    </body>
</html>
