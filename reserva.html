        <main class="container mt-4" style="max-width: 760px;">
            <h1>Reserva de mesa</h1>
            <p class="text-muted">Preencha os dados abaixo para reservar uma mesa na Cantina da Nonna.</p>

            <div id="alert-container"></div>

            <form id="reservaForm">
                <div class="border rounded p-4 mb-4">
                    <h2 class="h5 mb-3">Dados do cliente</h2>

                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="nome" class="form-label">Nome completo</label>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex.: Maria Silva" required minlength="3">
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="Ex.: maria@email.com" required>
                        </div>
                        <div class="col-md-3">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(48) 9 8765-4321" required>
                        </div>
                    </div>
                </div>

                <div class="border rounded p-4 mb-4">
                    <h2 class="h5 mb-3">Dados da reserva</h2>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="data" class="form-label">Data</label>
                            <input type="date" class="form-control" id="data" name="data" required>
                        </div>
                        <div class="col-md-4">
                            <label for="horario" class="form-label">Horário</label>
                            <input type="time" class="form-control" id="horario" name="horario" required>
                        </div>
                        <div class="col-md-4">
                            <label for="pessoas" class="form-label">Quantidade de pessoas</label>
                            <input type="number" class="form-control" id="pessoas" name="pessoas" placeholder="Ex.: 4" required min="1" max="20">
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label d-block">Área desejada</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="area-interna" name="area" value="interna" required>
                            <label class="form-check-label" for="area-interna">Área interna</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="area-externa" name="area" value="externa">
                            <label class="form-check-label" for="area-externa">Área externa</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" id="area-indiferente" name="area" value="indiferente">
                            <label class="form-check-label" for="area-indiferente">Indiferente</label>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label d-block">Preferências</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="cadeirao" name="preferencias" value="cadeirao">
                            <label class="form-check-label" for="cadeirao">Preciso de cadeirão infantil</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="aniversario" name="preferencias" value="aniversario">
                            <label class="form-check-label" for="aniversario">É uma comemoração de aniversário</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="acessibilidade" name="preferencias" value="acessibilidade">
                            <label class="form-check-label" for="acessibilidade">Preciso de acessibilidade</label>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label for="observacoes" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacoes" name="observacoes" rows="3" placeholder="Ex.: Mesa perto da janela"></textarea>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="confirmacao" name="confirmacao" required>
                    <label class="form-check-label" for="confirmacao">Confirmo que os dados da reserva estão corretos</label>
                </div>

                <div class="d-flex gap-2 mb-5">
                    <button type="submit" class="btn btn-nonna">Enviar reserva</button>
                    <button type="reset" class="btn btn-outline-secondary">Limpar formulário</button>
                </div>
            </form>
        </main>
